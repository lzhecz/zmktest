# Idle after 1 minute of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Sleep after 2 hours (I really need to figure out a wake button that isn't the reset button)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Uncomment the following line to turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y
